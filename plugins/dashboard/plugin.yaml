name: dashboard
version: 1.0.0
description: "Configurable dashboard with plugin-provided widgets"
entry: dashboard_plugin.DashboardPlugin
requires: []
optional: [weather, autonomous_thinking, scheduler]
capabilities: [tool, ws_handler, event]
config_defaults:
  # Default dashboard layout. Schema matches what the frontend's
  # ``renderDashboardGrid`` expects: ``{id, col, row}`` where col/row
  # are CSS-grid span strings ("start / end"). The frontend normaliser
  # translates legacy ``{widget, x, y, w, h}`` shapes too — kept for
  # compat, but new configs should use the native form below.
  default_layout:
    - {id: "clock",         col: "1 / 2", row: "1 / 2"}
    - {id: "weather",       col: "2 / 3", row: "1 / 2"}
    - {id: "system_status", col: "3 / 5", row: "1 / 2"}
    - {id: "memory_stats",  col: "1 / 3", row: "2 / 3"}
    - {id: "sessions",      col: "3 / 4", row: "2 / 3"}
    - {id: "thoughts",      col: "4 / 5", row: "2 / 3"}
    - {id: "notes",         col: "1 / 3", row: "3 / 4"}
    - {id: "search",        col: "3 / 5", row: "3 / 4"}
  refresh_interval_seconds: 30
  # Per-widget refresh intervals (seconds). Overrides the value each widget
  # declares in code. Use 0 to make a widget push-only (no periodic poll).
  widget_intervals:
    weather: 1800          # 30 min — Open-Meteo doesn't change often
    memory_stats: 60       # 1 min — collection counts tick slowly
    sessions: 30           # 30 s  — snappy for new chats
    system_status: 30      # 30 s  — health pings are cheap
    clock: 0               # purely client-side, no backend poll needed
    notes: 0               # push-only (event-driven on save/delete)
    search: 0              # interactive, no auto-refresh
    thoughts: 0            # push-only (broadcast on new autonomous thought)
