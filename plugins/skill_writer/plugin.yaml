name: skill_writer
version: 2.0.0   # Phase 11 — agentskills.io spec compliance
description: >-
  Self-improvement: Lexy writes spec-compliant Agent Skills
  (agentskills.io format), validates them, and runs them — plus
  spawns autonomous sub-agents.
entry: skill_writer_plugin.SkillWriterPlugin
requires: []
optional: [dashboard]
capabilities: [tool, event, ws_handler, hook]

config_defaults:
  skills_path: "./data/skills"
  auto_propose: true
  require_approval: true
  max_skill_size_bytes: 10000
  max_agents: 5
  agent_max_iterations: 10
  agent_timeout: 120.0
  # Phase 11: default license stamped onto auto-generated skills.
  # Empty string omits the license: field from the frontmatter.
  default_license: ""
  sandbox_allowed_imports:
    - json
    - re
    - datetime
    - math
    - collections
    - itertools
    - functools
    - pathlib
    - urllib.parse
    - time
    - hashlib
    - base64
