name: knowledge_acquisition
version: 1.0.0
description: "Autonomous RAG: search, chunk, categorize, embed, store for LoRA training"
entry: knowledge_plugin.KnowledgeAcquisitionPlugin
requires: [web_crawler]
optional: [dashboard]
capabilities: [tool, event, ws_handler]
config_defaults:
  max_concurrent_jobs: 2
  rate_limit_seconds: 3.0
  chunk_size: 800
  chunk_overlap: 100
  min_quality_score: 3
  dedup_threshold: 0.88
  max_pages_per_job: 10
  export_path: "./data/knowledge/exports"
  categories:
    - python_docs
    - web_article
    - tutorial
    - api_reference
    - library_docs
    - research_paper
    - general
